<div id="paymentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center;">
    
    <div style="background: #1e293b; padding: 25px; border-radius: 20px; width: 320px; border: 1px solid rgba(0, 242, 254, 0.3); position: relative;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <h3 style="color: #fff; margin: 0;">Complete Payment</h3>
            <p style="color: #94a3b8; font-size: 13px;">Unlock Full Project Details</p>
        </div>

        <div style="background: rgba(0, 242, 254, 0.1); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px;">
            <span style="color: #94a3b8; font-size: 12px;">To Pay:</span>
            <h2 style="color: #00f2fe; margin: 5px 0;">₹20.00</h2>
        </div>

        <p style="color: #fff; font-size: 14px; margin-bottom: 10px;">Select Payment App:</p>
        
        <div onclick="processPayment()" style="background: #fff; display: flex; align-items: center; padding: 10px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.3s;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" width="60" alt="GPay">
            <span style="color: #333; font-weight: bold; margin-left: auto;">Pay via GPay</span>
        </div>

        <div onclick="processPayment()" style="background: #fff; display: flex; align-items: center; padding: 10px; border-radius: 10px; margin-bottom: 10px; cursor: pointer;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Paytm_Logo_%28standalone%29.svg" width="60" alt="Paytm">
            <span style="color: #333; font-weight: bold; margin-left: auto;">Pay via Paytm</span>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <p style="color: #94a3b8; font-size: 12px;">--- OR SCAN QR ---</p>
            <div style="background: #fff; padding: 10px; display: inline-block; border-radius: 10px; margin-top: 5px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=upi://pay?pa=yourvpa@upi&pn=ProjectAI&am=20.00" width="100">
            </div>
        </div>

        <button onclick="closeModal()" style="background: none; border: none; color: #ef4444; width: 100%; margin-top: 15px; cursor: pointer; font-size: 14px;">Cancel Payment</button>
    </div>
</div>
